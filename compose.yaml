services:
  db:
    image: postgres:16.4-alpine
    # One core per query, as on the small production instance: parallel
    # workers would hide how much a sequential scan costs under load.
    command: ["postgres", "-c", "max_parallel_workers_per_gather=0"]
    environment:
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: reports
      POSTGRES_DB: reports
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reports -d reports"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://reports:reports@db:5432/reports
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    command: ["python3", "app.py"]
  loadgen:
    build: .
    environment:
      SERVICE_URL: http://api:8080
    depends_on:
      - api
    command: ["python3", "tools/load.py"]
  test:
    build: .
    environment:
      SERVICE_URL: http://api:8080
    depends_on:
      - api
    command: ["python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
volumes:
  pgdata:
